<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbershop — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400;1,6..96,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C; --ink:#08080A;
    --red:#C8102E; --red2:#E63950;
    --blue:#16306B; --blue2:#4E78C8;
    --cream:#F4EFE2; --white:#F7F5EF; --mut:#A7A39A;
    --glass:rgba(18,18,22,.62); --glass2:rgba(24,24,30,.70);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
    --display:'Oswald',system-ui,sans-serif;
    --body:'Manrope',system-ui,sans-serif;
    --serif:'Bodoni Moda',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;font-family:var(--body);color:var(--white);overflow:hidden;background:var(--bg)}

  /* animated barber-pole background + readability scrim */
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:var(--bg)}
  .bg-fallback{background:
    repeating-linear-gradient(125deg,rgba(200,16,46,.22) 0 70px,rgba(244,239,226,.05) 70px 140px,rgba(22,48,107,.24) 140px 210px,rgba(244,239,226,.05) 210px 280px),var(--bg)}
  .scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 0%,rgba(10,10,12,.30) 0%,rgba(10,10,12,.78) 70%,rgba(8,8,10,.92) 100%)}

  .screen{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto 1fr auto;
    grid-template-columns:1.32fr 1fr;grid-template-areas:"top top" "left right" "ticker ticker";
    gap:30px 40px;padding:36px 52px 0}

  /* ── top bar ───────────────────────────── */
  .topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:18px}
  .pole{width:26px;height:64px;border-radius:13px;border:2px solid rgba(255,255,255,.22);overflow:hidden;
    box-shadow:0 6px 22px rgba(0,0,0,.45);position:relative;background:#0c0c0e}
  /* Ugao 120° → y-period = 56px / cos(60°) = 56 / 0.5 = 112px (ceo broj → bez skoka pri loopu) */
  .pole i{position:absolute;left:-50%;top:-200%;width:200%;height:600%;
    background:repeating-linear-gradient(120deg,var(--red) 0 14px,var(--cream) 14px 28px,var(--blue) 28px 42px,var(--cream) 42px 56px);
    animation:poleSpin 4s linear infinite}
  @keyframes poleSpin{to{transform:translateY(112px)}}
  .wordmark .name{font-family:var(--display);font-weight:700;font-size:42px;letter-spacing:9px;line-height:.95;color:var(--white)}
  .wordmark .name b{color:var(--red2);font-weight:700}
  .wordmark .est{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--mut);letter-spacing:1px;margin-top:3px}
  .status{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:11px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .dot{width:11px;height:11px;border-radius:50%;background:#3ad17a;box-shadow:0 0 0 4px rgba(58,209,122,.18);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .status .lbl{font-family:var(--display);font-weight:600;letter-spacing:3px;font-size:15px}
  .status .hrs{color:var(--mut);font-size:14px;font-weight:600;letter-spacing:.5px}

  /* ── left: clock + queue ───────────────── */
  .left{grid-area:left;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .clock .t{font-family:var(--display);font-weight:600;font-size:clamp(108px,13vw,150px);line-height:.82;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;text-shadow:0 8px 40px rgba(0,0,0,.55)}
  .clock .t span{color:var(--red2)}
  .clock .d{font-family:var(--serif);font-style:italic;font-size:27px;color:var(--cream);opacity:.85;margin-top:10px;text-transform:capitalize}
  .next-title{display:flex;align-items:center;gap:14px;margin:26px 0 14px;
    font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:5px;color:var(--mut);text-transform:uppercase}
  .next-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
  .queue{display:flex;flex-direction:column;gap:11px;overflow:hidden}
  .q{display:flex;align-items:center;gap:18px;background:var(--glass);border:1px solid var(--line);
    border-radius:18px;padding:16px 22px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .q.now{border-color:rgba(230,57,80,.55);background:linear-gradient(100deg,rgba(200,16,46,.20),var(--glass2));
    box-shadow:0 10px 36px rgba(200,16,46,.18)}
  .q .qt{font-family:var(--display);font-size:42px;font-weight:600;color:var(--cream);min-width:120px;font-variant-numeric:tabular-nums}
  .q.now .qt{color:var(--red2)}
  .q .qn{font-size:28px;font-weight:700;letter-spacing:.2px}
  .q .qm{font-size:17px;color:var(--mut);font-weight:600;margin-top:2px}
  .q .tag{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:2px;
    color:var(--red2);border:1px solid rgba(230,57,80,.4);border-radius:999px;padding:6px 14px}
  .empty{color:var(--mut);font-size:22px;padding:22px;font-family:var(--serif);font-style:italic}

  /* ── right: next-client promo + music ──── */
  .right{grid-area:right;display:flex;flex-direction:column;gap:22px;min-height:0}
  .promo{flex:1;min-height:230px;border-radius:26px;border:1px solid var(--line2);overflow:hidden;position:relative;
    background:var(--glass2);box-shadow:0 22px 60px rgba(0,0,0,.5)}
  /* --- Promo: base (no photo) --- */
  .np-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:0;transition:opacity .6s}
  .np-bg.on{opacity:1}
  .np-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.08) 0%,rgba(10,10,12,0) 20%,rgba(10,10,12,.5) 55%,rgba(8,8,10,.97) 100%)}
  .np-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.16)}
  .np-empty svg{width:160px;height:160px}
  .np-label{position:absolute;top:22px;left:24px;z-index:4;display:flex;align-items:center;gap:9px;
    background:var(--red);color:var(--cream);font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:3px;
    padding:9px 16px;border-radius:11px;box-shadow:0 8px 24px rgba(200,16,46,.35)}
  .np-label .dot{width:8px;height:8px;background:var(--cream);box-shadow:none}
  .np-body{position:absolute;left:30px;right:30px;bottom:30px;z-index:3}
  .np-kicker{font-family:var(--serif);font-style:italic;font-size:20px;color:#fff;opacity:.9;margin-bottom:6px;
    text-shadow:0 2px 12px rgba(0,0,0,.95)}
  .np-name{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;letter-spacing:.5px;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,1),0 8px 32px rgba(0,0,0,.9)}
  .np-meta{font-size:23px;font-weight:700;color:rgba(255,255,255,.95);margin-top:8px;
    text-shadow:0 2px 14px rgba(0,0,0,.98)}
  /* --- Promo: split layout when photo present --- */
  /* Photo fills right 55%, face visible at center; text floats left */
  .promo.split .np-bg{left:auto;width:55%;background-position:center 15%;transform:none;border-radius:0 24px 24px 0}
  .promo.split .np-grad{
    background:linear-gradient(90deg,rgba(8,8,10,1) 0%,rgba(8,8,10,.96) 25%,rgba(8,8,10,.6) 50%,rgba(8,8,10,0) 72%)}
  .promo.split .np-body{left:30px;right:48%;top:50%;bottom:auto;transform:translateY(-50%)}
  .promo.split .np-name{font-size:clamp(28px,3.2vw,46px);word-break:break-word}
  .promo.split .np-meta{font-size:20px}
  .promo.split .np-empty{display:none!important}
  /* TV schedule slide */
  .np-sched{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:80px 30px 30px;gap:0;z-index:3;background:rgba(10,10,14,.55)}
  .np-sched-title{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:4px;
    color:var(--mut);text-transform:uppercase;margin-bottom:18px}
  .np-sched-row{display:flex;align-items:center;gap:16px;padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.07)}
  .np-sched-row:last-child{border-bottom:none}
  .np-sched-row .sr-t{font-family:var(--display);font-size:28px;font-weight:600;
    color:var(--red2);min-width:84px;font-variant-numeric:tabular-nums}
  .np-sched-row.active .sr-t{color:var(--white)}
  .np-sched-row .sr-i{flex:1}
  .np-sched-row .sr-n{font-size:22px;font-weight:700;color:var(--white)}
  .np-sched-row .sr-m{font-size:14px;color:var(--mut);font-weight:600;margin-top:2px}
  .np-sched-row.active .sr-m{color:var(--red2)}
  .np-sched-row .sr-b{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:2px;
    color:var(--red2);border:1px solid rgba(230,57,80,.4);border-radius:999px;padding:4px 10px}
  /* ── TV nav ────────────────────────────── */
  .tvnav{position:fixed;top:20px;right:20px;z-index:60;display:flex;gap:10px}
  .tvnav a,.tvnav-wi{font-family:var(--body);background:var(--glass);border:1px solid var(--line2);color:var(--mut);
    text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.5px;padding:9px 16px;border-radius:10px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.2s;cursor:pointer}
  .tvnav a:hover,.tvnav-wi:hover{border-color:rgba(230,57,80,.6);color:var(--cream)}
  .tvnav-wi{background:linear-gradient(180deg,rgba(200,16,46,.35),rgba(200,16,46,.22));border-color:rgba(230,57,80,.45);color:var(--cream)}

  /* ── cycling panel (desno) ─────────────── */
  /* .promo se koristi i dalje — dodajemo fade logiku u JS */
  .np-counter{position:absolute;bottom:22px;right:24px;z-index:3;
    font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:3px;color:rgba(244,239,226,.5);
    background:rgba(10,10,12,.45);padding:5px 10px;border-radius:8px}
  .music{height:168px;border-radius:24px;overflow:hidden;border:1px solid var(--line);position:relative;background:var(--ink)}
  .music iframe{width:100%;height:100%;border:0}
  .music .ml{position:absolute;top:14px;left:16px;z-index:3;display:flex;align-items:center;gap:8px;
    background:rgba(10,10,12,.72);font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:3px;color:var(--cream);
    padding:7px 13px;border-radius:9px;backdrop-filter:blur(10px)}
  .music .ml svg{width:15px;height:15px;color:var(--red2)}
  .music .play{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,rgba(10,10,12,.62),rgba(10,10,12,.85));color:var(--cream);cursor:pointer}
  .music .play .pi{width:54px;height:54px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(200,16,46,.4)}
  .music .play .pi svg{width:24px;height:24px;color:var(--cream);margin-left:3px}
  .music .play span{font-family:var(--display);font-weight:600;letter-spacing:3px;font-size:15px}
  .yt-edit{position:absolute;top:14px;right:14px;z-index:5;background:rgba(10,10,12,.72);border:1px solid var(--line);
    color:var(--cream);font-family:var(--body);font-weight:600;font-size:13px;letter-spacing:.5px;padding:7px 12px;border-radius:9px;cursor:pointer;backdrop-filter:blur(10px)}
  .yt-edit:hover{border-color:var(--red2);color:var(--red2)}
  .yt-panel{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;justify-content:center;gap:11px;
    padding:20px 22px;background:rgba(10,10,12,.94);backdrop-filter:blur(14px)}
  .yt-panel.on{display:flex}
  .yt-panel .yt-h{font-family:var(--display);font-weight:500;letter-spacing:2px;font-size:14px;color:var(--cream)}
  .yt-panel input{width:100%;padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--line2);
    color:var(--white);font-size:15px;font-family:var(--body)}
  .yt-panel input:focus{outline:none;border-color:var(--red2)}
  .yt-row{display:flex;gap:10px}
  .yt-btn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line2);background:transparent;color:var(--cream);
    font-family:var(--display);font-weight:500;letter-spacing:1.5px;font-size:14px;cursor:pointer}
  .yt-btn.go{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;color:var(--cream)}
  .yt-btn:hover{border-color:var(--red2)}

  /* ── Walk-in modal ─────────────────────── */
  .wi-wrap{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:none;
    align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .wi-wrap.on{display:flex}
  .wi-modal{background:#16161c;border:1px solid var(--line2);border-radius:26px;padding:40px;
    width:min(480px,92vw);box-shadow:0 30px 90px rgba(0,0,0,.7)}
  .wi-title{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:4px;margin-bottom:28px}
  .wi-label{font-size:13px;font-weight:700;letter-spacing:3px;color:var(--mut);text-transform:uppercase;margin:20px 0 10px}
  .wi-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:12px;
    padding:14px 18px;color:var(--white);font-family:var(--body);font-size:18px;outline:none}
  .wi-input:focus{border-color:var(--red2)}
  .wi-chips{display:flex;flex-wrap:wrap;gap:9px}
  .wi-chip{font-family:var(--body);font-size:14px;font-weight:600;padding:9px 16px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);cursor:pointer;transition:.15s}
  .wi-chip:hover{border-color:var(--line2);color:var(--cream)}
  .wi-chip.sel{background:rgba(200,16,46,.22);border-color:rgba(230,57,80,.6);color:var(--cream)}
  .wi-foot{display:flex;gap:12px;margin-top:28px}
  .wi-btn{flex:1;padding:14px;border-radius:12px;font-family:var(--display);font-weight:600;
    font-size:15px;letter-spacing:2px;cursor:pointer;border:1px solid var(--line2);
    background:transparent;color:var(--mut);transition:.15s}
  .wi-btn.ok{background:linear-gradient(180deg,var(--red2),var(--red));border-color:transparent;color:var(--cream)}
  .wi-btn.ok:disabled{opacity:.35;cursor:not-allowed}
  .wi-btn:not(.ok):hover{border-color:var(--line2);color:var(--cream)}
  /* ── Closed overlay ─────────────────────── */
  .closed-wrap{position:fixed;inset:0;z-index:80;background:rgba(8,8,10,.92);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .closed-wrap.on{display:flex}
  .closed-mark{display:flex;align-items:center;gap:18px;margin-bottom:40px}
  .closed-mark .pole{width:26px;height:64px;border-radius:13px;border:2px solid rgba(255,255,255,.22);
    overflow:hidden;box-shadow:0 6px 22px rgba(0,0,0,.45);position:relative;background:#0c0c0e}
  .closed-mark .pole i{position:absolute;left:-50%;top:-200%;width:200%;height:600%;
    background:repeating-linear-gradient(120deg,var(--red) 0 14px,var(--cream) 14px 28px,var(--blue) 28px 42px,var(--cream) 42px 56px);
    animation:poleSpin 4s linear infinite}
  .closed-mark .wm{font-family:var(--display);font-weight:700;font-size:36px;letter-spacing:8px;color:var(--white)}
  .closed-mark .wm b{color:var(--red2)}
  .closed-big{font-family:var(--display);font-weight:600;font-size:clamp(72px,9vw,120px);
    letter-spacing:14px;color:var(--white);line-height:1}
  .closed-sub{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--mut);margin-top:20px}
  .closed-book{margin-top:44px;display:inline-flex;align-items:center;gap:12px;
    font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:3px;
    color:var(--white);background:var(--red2);
    padding:18px 48px;border-radius:4px;text-decoration:none;
    box-shadow:0 8px 32px rgba(200,16,46,.45);
    transition:transform .2s,box-shadow .2s}
  .closed-book:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(200,16,46,.65)}
  /* ── ticker ────────────────────────────── */
  .ticker{grid-area:ticker;height:64px;margin:0 -52px;border-top:1px solid var(--line);
    background:linear-gradient(90deg,rgba(200,16,46,.10),rgba(22,48,107,.10));overflow:hidden;
    display:flex;align-items:center;backdrop-filter:blur(10px)}
  .ticker .track{display:flex;gap:54px;white-space:nowrap;animation:marq 32s linear infinite;padding-left:52px}
  .ticker .it{font-family:var(--display);font-weight:500;letter-spacing:3px;font-size:18px;color:var(--cream);display:flex;align-items:center;gap:14px}
  .ticker .it b{color:var(--red2);font-weight:600}
  .ticker .it::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue2)}
  @keyframes marq{to{transform:translateX(-50%)}}

  /* ── welcome overlay ───────────────────── */
  .welcome{position:fixed;inset:0;z-index:50;
    background:radial-gradient(120% 90% at 50% 28%,rgba(28,20,24,.96) 0%,rgba(8,8,10,.985) 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .5s;backdrop-filter:blur(8px)}
  .welcome.on{opacity:1;pointer-events:auto}
  .welcome .hi{font-family:var(--display);font-size:32px;font-weight:500;letter-spacing:11px;color:var(--red2);text-transform:uppercase}
  .welcome .nm{font-family:var(--display);font-size:128px;font-weight:700;line-height:1;margin-top:16px;letter-spacing:-1px}
  .welcome .nm span{color:var(--cream)}
  .welcome .pic{margin-top:38px;width:420px;height:420px;border-radius:30px;overflow:hidden;
    border:3px solid rgba(230,57,80,.6);box-shadow:0 0 90px rgba(200,16,46,.28),0 30px 80px rgba(0,0,0,.6)}
  .welcome .pic img{width:100%;height:100%;object-fit:cover}
  .welcome .cap{margin-top:26px;font-family:var(--serif);font-style:italic;font-size:28px;color:var(--cream);opacity:.85}
  .welcome .wcount{margin-top:18px;font-family:var(--display);font-weight:500;letter-spacing:4px;font-size:16px;color:var(--red2);min-height:20px}

  .demo{position:fixed;bottom:16px;right:16px;z-index:60;background:var(--glass);border:1px solid var(--line);
    color:var(--mut);font-size:13px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;opacity:.55;backdrop-filter:blur(10px)}
  .demo:hover{opacity:1}

  @media (prefers-reduced-motion: reduce){
    .pole i,.dot,.ticker .track{animation:none}
  }

  /* ── Mobile (≤899px) ───────────────────── */
  @media(max-width:899px){
    html,body{overflow-y:auto;height:auto}
    .screen{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;
      grid-template-areas:"top" "left" "right" "ticker";
      height:auto;min-height:100vh;gap:16px 0;padding:20px 18px 0}
    .topbar{flex-wrap:wrap;gap:10px;padding-top:50px}
    .mark{gap:12px}
    .pole{width:20px;height:50px;border-radius:10px}
    .wordmark .name{font-size:28px;letter-spacing:6px}
    .wordmark .est{font-size:13px;margin-top:2px}
    .status{padding:8px 14px}
    .status .lbl{font-size:13px;letter-spacing:2px}
    .status .hrs{font-size:12px}
    .clock .t{font-size:clamp(72px,18vw,108px)}
    .clock .d{font-size:18px;margin-top:6px}
    .next-title{font-size:15px;letter-spacing:4px;margin:18px 0 10px}
    .q{padding:12px 14px;gap:12px;border-radius:14px}
    .q .qt{font-size:28px;min-width:80px}
    .q .qn{font-size:20px}
    .q .qm{font-size:14px}
    .queue{gap:8px}
    .right{gap:14px;margin-top:4px}
    .promo{min-height:240px;border-radius:18px}
    .np-name{font-size:36px}
    .np-meta{font-size:17px;margin-top:5px}
    .np-kicker{font-size:15px}
    .np-label{top:14px;left:16px;font-size:13px;padding:7px 12px}

  }
</style>
</head>

<!-- Walk-in modal -->

<!-- Closed overlay -->
<div class="closed-wrap" id="closedWrap">

  </div>

<div class="screen">

  <div class="right">

      <div class="np-empty" id="npEmpty">

        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        MUZIKA

<!-- WELCOME -->
<div class="welcome" id="welcome">

<script type="module">
  (async () => {
    const bg = document.getElementById('bg');
    try {
      const { mountWaveBackground } = await import('./wave-bg.js');
      mountWaveBackground(bg, {
        intensity: 0.5,
        resolutionScale: 1.0,
        colors: { red: '#C8102E', blue: '#16306B', cream: '#F4EFE2', bg: '#0A0A0C' }
      });
    } catch (e) { bg.classList.add('bg-fallback'); } // offline / no-WebGL safe
  })();
</script>
<script src="config.js"></script>
<script>window.POLL_MS = 3000;</script>
<script src="api.js"></script>
<script>
const $=s=>document.querySelector(s);

$('#estLine').textContent = SALON.tagline || 'Classic Cuts';
$('#hours').textContent = String(SALON.hours.open).padStart(2,'0') + ' — ' + SALON.hours.close + 'h';

$('#ticker').innerHTML = (()=>{
  const items = SERVICES.map(s=>`<div class="it">${s.name} <b>${s.price} RSD</b></div>`).join('')
    + `<div class="it">WALK-INS WELCOME</div><div class="it">${SALON.tagline}</div>`;
  return items + items;
})();

// ── Sat ──
function tick(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  $('#clock').innerHTML=`${hh}<span>:</span>${mm}`;
  $('#date').textContent=d.toLocaleDateString('sr-RS',{weekday:'long',day:'numeric',month:'long'});
  checkWelcome(d);
}
setInterval(tick,1000);

// ── Muzika ──
function ytEmbed(u){
  u=(u||'').trim(); let m;
  if(/youtube\.com\/embed\//.test(u)) return u;
  if(m=u.match(/[?&]list=([\w-]+)/)) return 'https://www.youtube.com/embed/videoseries?list='+m[1];
  if(m=u.match(/[?&]v=([\w-]+)/))    return 'https://www.youtube.com/embed/'+m[1];
  if(m=u.match(/youtu\.be\/([\w-]+)/)) return 'https://www.youtube.com/embed/'+m[1];
  if(/^[\w-]{11}$/.test(u))           return 'https://www.youtube.com/embed/'+u;
  return null;
}
function currentYt(){ return localStorage.getItem('yt_url')||SALON.youtube; }
function playYt(e){ $('#yt').src=e+(e.includes('?')?'&':'?')+'autoplay=1'; $('#play').style.display='none'; $('#ytPanel').classList.remove('on'); }
$('#play').onclick=()=>playYt(currentYt());
$('#ytEdit').onclick=()=>{ $('#ytInput').value=''; $('#ytPanel').classList.toggle('on'); $('#ytInput').focus(); };
$('#ytGo').onclick=()=>{ const e=ytEmbed($('#ytInput').value); if(!e){$('#ytInput').placeholder='Nevažeći link'; $('#ytInput').value=''; return;} localStorage.setItem('yt_url',e); playYt(e); };
$('#ytInput').onkeydown=ev=>{ if(ev.key==='Enter') $('#ytGo').click(); };
$('#ytSearch').onclick=()=>{ window.open('https://www.youtube.com/results?search_query='+encodeURIComponent($('#ytInput').value.trim()||'lofi barbershop'),'_blank'); };

// ── Stanje sesije ──
function toMins(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function getSessionState(){
  const now=new Date(), nowMins=now.getHours()*60+now.getMinutes();
  const today=loadAppts().filter(a=>a.date===todayStr()).sort((x,y)=>x.time.localeCompare(y.time));
  const current=[], upcoming=[];
  for(const a of today){
    const start=toMins(a.time), dur=(serviceById(a.serviceId)?.min)||30;
    if(start<=nowMins && nowMins<start+dur) current.push(a);
    else if(start>nowMins) upcoming.push(a);
  }
  return {current, next:upcoming[0]||null, upcoming};
}

// ── Cycling panel (desna karta: na redu → klijent A → klijent B…) ──
let _slides=[], _slideIdx=0, _cycleTimer=null, _fading=false;

function applySlide(slide){
  const sched=$('#npSched'), body=$('#npBody'), empty=$('#npEmpty'), bg=$('#npBg');
  sched.style.display='none'; body.style.display='block';
  $('#npCounter').textContent=_slides.length>1?`${_slideIdx+1} / ${_slides.length}`:'';

  const card=$('#nextCard');
  if(slide.type==='empty'){
    card.classList.remove('split');
    $('#npLabel').innerHTML='<span class="dot"></span>ČEKA SE';
    $('#npKicker').textContent=''; $('#npName').textContent='—'; $('#npMeta').textContent='Nema termina za sada';
    bg.classList.remove('on'); empty.style.display='flex';
    return;
  }

  if(slide.type==='tv'){
    card.classList.remove('split');
    $('#npLabel').innerHTML='<span class="dot"></span>DANAS';
    bg.classList.remove('on'); empty.style.display='none'; body.style.display='none';
    sched.style.display='flex';
    sched.innerHTML='<div class="np-sched-title">Raspored za danas</div>'
      +slide.list.map(a=>{
        const s=serviceById(a.serviceId)?.name||'', b=barberById(a.barberId)?.name||'';
        const inChair=slide.currentIds.includes(a.id);
        return `<div class="np-sched-row${inChair?' active':''}">
          <div class="sr-t">${a.time}</div>
          <div class="sr-i"><div class="sr-n">${a.name}</div><div class="sr-m">${s} · ${b}</div></div>
          ${inChair?'<div class="sr-b">U STOLICI</div>':''}
        </div>`;
      }).join('');
    return;
  }

  const a=slide.client, s=serviceById(a.serviceId)?.name||'', b=barberById(a.barberId)?.name||'';
  const photo=getPhoto(a.name,a.phone);
  if(slide.type==='next'){
    $('#npLabel').innerHTML='<span class="dot"></span>NA REDU';
    $('#npKicker').textContent='Sledeći u stolici';
  } else {
    $('#npLabel').innerHTML=`<span class="dot"></span>U STOLICI · ${b.toUpperCase()}`;
    $('#npKicker').textContent='Trenutno';
  }
  $('#npName').textContent=a.name;
  $('#npMeta').textContent=`${a.time} · ${s}`;
  if(photo){ bg.style.backgroundImage=`url('${photo}')`; bg.classList.add('on'); empty.style.display='none'; card.classList.add('split'); }
  else { bg.classList.remove('on'); empty.style.display='flex'; card.classList.remove('split'); }
}

function buildSlides(current,next,upcoming){
  const slides=[];
  const allToday=[...current,...upcoming];
  if(allToday.length) slides.push({type:'tv',list:allToday.slice(0,4),currentIds:current.map(c=>c.id)});
  for(const c of current) slides.push({type:'now',client:c});
  if(next) slides.push({type:'next',client:next});
  return slides.length?slides:[{type:'empty'}];
}

function cycleNext(){
  if(_slides.length<=1||_fading) return;
  _fading=true;
  const card=$('#nextCard');
  card.style.transition='opacity 0.5s ease';
  card.style.opacity='0';
  setTimeout(()=>{
    _slideIdx=(_slideIdx+1)%_slides.length;
    applySlide(_slides[_slideIdx]);
    card.style.opacity='1';
    setTimeout(()=>{ card.style.transition=''; _fading=false; }, 550);
  }, 500);
}

function startCycle(){
  clearInterval(_cycleTimer);
  if(_slides.length>1) _cycleTimer=setInterval(cycleNext, 7000);
}

// ── Queue (leva lista) ──
let _lastQKey='';
function renderQueue(){
  const {current,next,upcoming}=getSessionState();

  // Leva lista: klijenti u stolici (označeni) + nadolazeći
  const allVisible=[...current,...upcoming].slice(0,5);
  const qKey=allVisible.map(a=>a.id+a.greeted).join(',')+current.map(a=>a.id).join('|');
  if(qKey!==_lastQKey){
    _lastQKey=qKey;
    $('#queue').innerHTML=allVisible.length?allVisible.map(a=>{
      const b=barberById(a.barberId)?.name||'', s=serviceById(a.serviceId)?.name||'';
      const inChair=current.includes(a);
      return `<div class="q ${inChair?'now':''}"><div class="qt">${a.time}</div>
        <div><div class="qn">${a.name}</div><div class="qm">${s} · ${b}</div></div>
        ${inChair?'<div class="tag">U STOLICI</div>':''}
        </div>`;
    }).join(''):'<div class="empty">Nema više termina danas — uđi, sediš odmah.</div>';
  }

  // Cycling panel — osvežava samo ako se lista promenila
  const newSlides=buildSlides(current,next,upcoming);
  const slideKey=s=>s.type==='tv'
    ?'tv:'+(s.list||[]).map(a=>a.id).join('-')+':'+(s.currentIds||[]).join('-')
    :s.type+':'+(s.client?.id||'')+(s.client?':'+(getPhoto(s.client.name,s.client.phone)?'1':'0'):'');
  const newKey=newSlides.map(slideKey).join(',');
  const oldKey=_slides.map(slideKey).join(',');
  if(newKey!==oldKey){
    _slides=newSlides; _slideIdx=0;
    applySlide(_slides[0]);
    startCycle();
  }
}

// ── Welcome overlay ──
const WELCOME_MS=10000;
let wQueue=[],wIdx=0,wTimer=null,wActive=false;
function renderWelcome(a){
  const first=(a.name||'').split(' ')[0]||a.name;
  $('#wName').innerHTML=`<span>${first}</span>`;
  const photo=getPhoto(a.name,a.phone);
  if(photo){$('#wImg').src=photo;$('#wPic').style.display='block';$('#wCap').textContent='Lepo je videti te ponovo.';}
  else{$('#wPic').style.display='none';$('#wCap').textContent='Dobrodošao u salon.';}
  $('#wCount').textContent=wQueue.length>1?`${wIdx+1} / ${wQueue.length}`:'';
}
function runWelcome(){
  if(wIdx>=wQueue.length){$('#welcome').classList.remove('on');wQueue=[];wIdx=0;wActive=false;clearTimeout(wTimer);return;}
  wActive=true; renderWelcome(wQueue[wIdx]); $('#welcome').classList.add('on'); wIdx++;
  clearTimeout(wTimer); wTimer=setTimeout(runWelcome,WELCOME_MS);
}
function showWelcome(a){
  const key=(a.name||'').trim().toLowerCase()+'|'+(a.phone||'').trim();
  if(wQueue.some(x=>(x.name||'').trim().toLowerCase()+'|'+(x.phone||'').trim()===key)) return;
  wQueue.push(a);
  if(!wActive) runWelcome();
  else $('#wCount').textContent=`${wIdx} / ${wQueue.length}`;
}
function checkWelcome(d){
  const t=d.toTimeString().slice(0,5);
  loadAppts().filter(a=>a.date===todayStr()&&a.time===t&&!a.greeted).forEach(a=>{
    a.greeted=true;
    fetch('/api/appointments/greet',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:a.id})});
    showWelcome(a);
  });
}

onData(renderQueue);

$('#demo').onclick=()=>{
  const list=loadAppts().filter(a=>a.date===todayStr()).sort((x,y)=>x.time.localeCompare(y.time));
  showWelcome(list[0]||{name:'Test Klijent',phone:''});
};

// ── Walk-in ──
(()=>{
  let wiService=null, wiBarber=null;
  $('#wiServices').innerHTML=SERVICES.map(s=>`<div class="wi-chip" data-id="${s.id}">${s.name}</div>`).join('');
  $('#wiBarbers').innerHTML=BARBERS.map(b=>`<div class="wi-chip" data-id="${b.id}">${b.name}</div>`).join('');
  function wiCheck(){ $('#wiOk').disabled=!(wiService&&wiBarber&&$('#wiName').value.trim()); }
  $('#wiServices').onclick=e=>{
    const c=e.target.closest('.wi-chip'); if(!c) return;
    document.querySelectorAll('#wiServices .wi-chip').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); wiService=c.dataset.id; wiCheck();
  };
  $('#wiBarbers').onclick=e=>{
    const c=e.target.closest('.wi-chip'); if(!c) return;
    document.querySelectorAll('#wiBarbers .wi-chip').forEach(x=>x.classList.remove('sel'));
    c.classList.add('sel'); wiBarber=c.dataset.id; wiCheck();
  };
  $('#wiName').oninput=wiCheck;
  $('#wiBtn').onclick=()=>{ $('#wiWrap').classList.add('on'); $('#wiName').focus(); };
  $('#wiCancel').onclick=()=>closeWi();
  $('#wiWrap').onclick=e=>{ if(e.target===$('#wiWrap')) closeWi(); };
  function closeWi(){
    $('#wiWrap').classList.remove('on');
    $('#wiName').value=''; wiService=null; wiBarber=null;
    document.querySelectorAll('.wi-chip').forEach(x=>x.classList.remove('sel'));
    wiCheck();
  }
  $('#wiOk').onclick=async()=>{
    const name=$('#wiName').value.trim();
    if(!name||!wiService||!wiBarber) return;
    // Nađi prvi slobodan slot od sada
    const free=freeSlots(todayStr(),wiBarber);
    const now=new Date(), nowStr=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const slot=free.find(t=>t>=nowStr)||free[0];
    if(!slot){ alert('Nema slobodnih termina za danas.'); return; }
    $('#wiOk').disabled=true;
    await addAppt({date:todayStr(),time:slot,barberId:wiBarber,serviceId:wiService,name,phone:'walk-in'});
    closeWi();
  };
})();

// ── Closed mode ──
function checkClosed(){
  const h=new Date().getHours();
  const closed=h<SALON.hours.open||h>=SALON.hours.close;
  $('#closedWrap').classList.toggle('on',closed);
  if(closed){
    const openH=String(SALON.hours.open).padStart(2,'0')+':00';
    $('#closedSub').textContent = h>=SALON.hours.close
      ? `Vidimo se sutra u ${openH}`
      : `Otvaramo u ${openH}`;
  }
}
setInterval(checkClosed, 60000);

tick(); renderQueue(); checkClosed();
</script>
